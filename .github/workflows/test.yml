name: Hermetic verification

on:
  push:
    branches: [main]
  # Every pull request, including one stacked on another PR's branch, gets
  # the full matrix before it can land anywhere that later reaches main.
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ['3.11', '3.12', '3.13', '3.14']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    env:
      PYTHONDONTWRITEBYTECODE: '1'

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ matrix.python }}

      - name: Show runtime versions
        run: |
          python3 --version
          bash --version | head -1

      - name: Run hermetic suite and executable contracts
        run: make test

      - name: Prove tests did not mutate or create product files
        run: |
          git diff --exit-code
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

  windows:
    # Native Windows runs the full hermetic suite (no WSL). The image has no
    # GNU make, so the bash loops mirror the Makefile targets. fsat.fchmod is a
    # no-op below Python 3.13 on Windows; the matrix covers both behaviors.
    name: windows-latest / Python ${{ matrix.python }}
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12', '3.13', '3.14']
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHON: python
    defaults:
      run:
        shell: bash

    steps:
      - name: Disable line-ending translation before checkout
        # The runner image ships autocrlf=true globally; frontmatter parsing
        # and content hashing require byte-exact LF checkouts.  Must run
        # before actions/checkout writes any file.
        run: git config --global core.autocrlf false

      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ matrix.python }}

      - name: Show runtime versions
        run: |
          python --version
          bash --version | head -1

      - name: Run Python suites
        run: |
          set -eu
          for test_file in tests/test_*.py; do
            echo "=== $test_file ==="
            python "$test_file"
          done

      - name: Run shell suites
        run: |
          set -eu
          for test_file in tests/test_*.sh; do
            echo "=== $test_file ==="
            bash "$test_file"
          done

      - name: Run executable contracts and package validation
        run: |
          python scripts/claude-obsidian.py contracts --check-only
          python scripts/claude-obsidian.py contracts --verify
          python scripts/claude-obsidian.py package validate

      - name: Prove tests did not mutate or create product files
        run: |
          git diff --exit-code
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

  release-safety:
    name: Reproducible release artifact
    runs-on: ubuntu-latest
    timeout-minutes: 8
    needs: test
    env:
      PYTHONDONTWRITEBYTECODE: '1'

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.11'

      - name: Build and audit the public artifact twice
        run: |
          python3 scripts/claude-obsidian.py release build --output "$RUNNER_TEMP/first.zip"
          python3 scripts/claude-obsidian.py release build --output "$RUNNER_TEMP/second.zip"
          cmp "$RUNNER_TEMP/first.zip" "$RUNNER_TEMP/second.zip"
          python3 scripts/claude-obsidian.py release audit "$RUNNER_TEMP/first.zip"
